openapi: 3.0.0
info:
  title: User Service API
  version: 1.0.0
  description: API for managing users with MongoDB
paths:
  /createuser:
    post:
      summary: Creates a new user
      description: Stores a new user in MongoDB Atlas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - confirmPassword
              properties:
                username:
                  type: string
                  example: "testuser"
                password:
                  type: string
                  example: "mysecurepass"
                confirmPassword:
                  type: string
                  example: "mysecurepass"
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  username:
                    type: string
        '400':
          description: Validation error (missing fields or password mismatch)
        '409':
          description: Conflict (Username already exists)