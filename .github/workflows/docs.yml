name: Deploy Docs to Pages

on:
  push:
    branches: 
      - master
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install Ruby and Asciidoctor
        # El build usa asciidoctor y asciidoctor-diagram, hay que instalarlos en el runner
        run: |
          sudo apt-get install -y graphviz
          sudo gem install asciidoctor asciidoctor-diagram

      - name: Install JS dependencies
        # Esto instala shx y gh-pages dentro de la carpeta docs
        run: npm install
        working-directory: ./docs

      - name: Build documentation
        # Ejecuta tu script: shx rm -rf build && asciidoctor...
        run: npm run build
        working-directory: ./docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Subimos la carpeta 'build' que generó el comando anterior
          path: './docs/build'

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
