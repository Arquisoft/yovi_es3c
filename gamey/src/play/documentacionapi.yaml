openapi: 3.0.0
info:
  title: Gamey Bot API
  description: API para selección de movimientos de bots en el juego YEN (YOVI).
  version: 0.1.0

servers:
  - url: http://localhost:4000
    description: Development server
  - url: http://20.199.40.219
    description: Production server

paths:
  /play:
    post:
      summary: Solicita el siguiente movimiento dado el estado del tablero en notación YEN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - position
              properties:
                position:
                  type: object
                  description: Estado actual del tablero en notación YEN.
                  required:
                    - size
                    - turn
                    - players
                    - layout
                  properties:
                    size:
                      type: integer
                      description: Tamaño del tablero.
                    turn:
                      type: integer
                      description: Índice del jugador al que le toca mover.
                    players:
                      type: array
                      items:
                        type: string
                      description: Lista de jugadores (e.g. ["B", "R"]).
                    layout:
                      type: string
                      description: Representación del tablero en texto.
                bot_id:
                  type: string
                  description: Identificador del bot que debe elegir el movimiento. Si no se especifica, se usa "montecarlo_bot" por defecto.
                  default: montecarlo_bot
      responses:
        '200':
          description: Siguiente movimiento calculado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  next_move:
                    type: object
                    description: Estado del tablero tras el movimiento, en notación YEN.
                    properties:
                      size:
                        type: integer
                        description: Tamaño del tablero.
                      turn:
                        type: integer
                        description: Índice del jugador al que le toca mover.
                      players:
                        type: array
                        items:
                          type: string
                        description: Lista de jugadores (e.g. ["B", "R"]).
                      layout:
                        type: string
                        description: Representación del tablero tras el movimiento.
        '500':
          description: Error al contactar con el módulo Rust o al procesar la respuesta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Descripción del error ocurrido.